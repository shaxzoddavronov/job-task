# CPU configuration — works everywhere, including machines with no GPU.
# The launcher scripts add docker-compose.gpu.yml on top when a GPU is found.
services:
  ollama:
    image: ollama/ollama
    volumes:
      # Named volume so the model survives a rebuild; it is a few GB and
      # downloading it again on every start would be painful.
      - ollama-models:/root/.ollama
    environment:
      # Plan section 9. Flash attention is required for the quantized KV cache.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      # Never evict the model between requests.
      OLLAMA_KEEP_ALIVE: "-1"
      # 1 on CPU, 4 on GPU — set by the launcher.
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: "http://ollama:11434"
      # Free VRAM measured on the *host* by the launcher; 0 means no GPU.
      # This is the only hardware signal the app gets (plan section 8.1).
      HOST_GPU_FREE_MB: "${HOST_GPU_FREE_MB:-0}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama-models:

[project]
name = "uz-legal-qa"
version = "0.1.0"
description = "Uzbek legal QA bot: semantic search without LLMs or transformers"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# SIM905: "a b c".split() is the clearest way to write Uzbek word lists.
ignore = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["db: needs a running PostgreSQL (DATABASE_URL); skipped otherwise"]

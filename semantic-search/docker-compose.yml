name: uz-legal-qa

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa}
      POSTGRES_DB: ${POSTGRES_DB:-qa}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: uz-legal-qa:latest
    pull_policy: build  # built locally, never pulled from a registry
    command: ["api"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_SOURCE: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qa}:${POSTGRES_PASSWORD:-qa}@db:5432/${POSTGRES_DB:-qa}
      # answers.csv / questions.csv (or .xlsx) from ./data, used by the first-run import
      ANSWERS_PATH: /app/data-import/answers.csv
      QUESTIONS_PATH: /app/data-import/questions.csv
      # Compute and threshold overrides from .env (empty = defaults)
      DEVICE: ${DEVICE:-auto}
      RERANKER: ${RERANKER:-auto}
      CPU_THREADS: ${CPU_THREADS:-}
      ANSWER_THRESHOLD_RERANK: ${ANSWER_THRESHOLD_RERANK:-}
      SUGGEST_THRESHOLD_RERANK: ${SUGGEST_THRESHOLD_RERANK:-}
      ANSWER_THRESHOLD_DENSE: ${ANSWER_THRESHOLD_DENSE:-}
      SUGGEST_THRESHOLD_DENSE: ${SUGGEST_THRESHOLD_DENSE:-}
    volumes:
      # Private data files, read-only; only needed for the first import into PostgreSQL
      - ./data:/app/data-import:ro
      # Transformer models (~4.5 GB, downloaded once) and cached document embeddings
      - models:/models
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30m  # first start downloads the models
    restart: unless-stopped

  bot:
    image: uz-legal-qa:latest  # same image as api (built by the api service)
    pull_policy: never
    command: ["bot"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      # From .env or the shell; `make up` falls back to bot_token.txt. Never baked into the image.
      BOT_TOKEN: ${BOT_TOKEN:-}
    restart: unless-stopped

volumes:
  pgdata:
  models:

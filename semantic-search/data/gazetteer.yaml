# Organization (ORG) and document/concept (TERM) aliases → canonical tokens ORG_<id> / TERM_<id>.
# Curated by hand; candidates come from `make gazetteer` (reports/gazetteer_candidates.yaml).
#
# - Aliases match case-insensitively, longest first, with optional Uzbek suffixes (DXMga, DXM-ga,
#   DXM ga, markaziga). Input is transliterated first, so Cyrillic aliases are unnecessary.
# - `case_sensitive` aliases must match exactly; use it when the lowercase form is an ordinary word
#   (ERI vs "eri" = "her husband").
# - Add an entry only when several surface forms mean the same thing (abbreviation ↔ long form,
#   colloquial or Russian names users type). Single generic words (sud, bank) stay out.


# Query-side synonyms: colloquial / Russian words → the wording used in the answer bank.
# A match (whole word, optional Uzbek suffixes: pravamni, spravkaga) appends `canonical` to the
# query; the original words stay. Input is normalized first (Cyrillic → Latin, lowercase).
# Organizations and abbreviations belong in gazetteer.yaml, not here.

